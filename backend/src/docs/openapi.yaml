                status: { type: string, enum: [active, suspended] }
      responses:
        '200': { description: Trạng thái đã cập nhật; refresh tokens bị thu hồi khi khóa }
  /api/admin/merchant-claims:
    get:
      tags: [Admin]
      summary: Danh sách hồ sơ chủ quán
      operationId: adminListMerchantClaims
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Danh sách hồ sơ }
  /api/admin/merchant-claims/{id}:
    patch:
      tags: [Admin]
      summary: Duyệt hoặc từ chối quyền chủ quán
      operationId: adminDecideMerchantClaim
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
