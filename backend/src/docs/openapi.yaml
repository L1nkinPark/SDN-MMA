        '200': { description: Danh sách booking }
  /api/bookings/{id}/cancel:
    post:
      tags: [Bookings]
      summary: Người đặt hủy trước giờ đến ít nhất 1 giờ
      operationId: cancelMyBooking
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 'Booking đã hủy, slot được trả lại' }
        '409': { description: Không thể hủy }
  /api/bookings/{id}/merchant-decision:
    patch:
      tags: [Merchants]
      summary: Nhân viên xác nhận khách đến, hủy hoặc ghi nhận không đến
      operationId: merchantBookingDecision
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [arrived, cancel, no_show] }
      responses:
        '200': { description: Đã cập nhật booking; arrived tạo bằng chứng đã ghé }
        '403': { description: Không sở hữu địa điểm }
